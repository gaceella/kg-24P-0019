services:
  py:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - .:/work
    stdin_open: true
    tty: true
  fuseki:
    build:
      context: .
      dockerfile: Dockerfile.fuseki
    ports:
      - "3030:3030"
    volumes:
      - fuseki-data:/fuseki-data
volumes:
  fuseki-data:
